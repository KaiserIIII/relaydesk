name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Environment
        run: python -VV
      - name: Full test suite
        run: python -X utf8 -W error::ResourceWarning -m unittest discover -s tests -v
      - name: CLI smoke flow
        shell: bash
        run: |
          set -euo pipefail
          DATA="$RUNNER_TEMP/relaydesk-demo"
          python -m relaydesk --data-dir "$DATA" demo
          python -m relaydesk --data-dir "$DATA" import-jsonl examples/messages.jsonl
          python -m relaydesk --data-dir "$DATA" search 中文
          python -m relaydesk --data-dir "$DATA" doctor
          python -m relaydesk --data-dir "$DATA" backup "$RUNNER_TEMP/relaydesk-backup.sqlite"
